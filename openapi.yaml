openapi: 3.0.3
info:
  title: URL Shortener API
  version: 1.0.0
  description: Create short links with optional custom codes and expiry. No authentication required.
servers:
  - url: http://localhost:3000
    description: Local development API
security: []
tags:
  - name: Links
paths:
  /api/v1:
    post:
      tags:
        - Links
      operationId: createShortLink
      summary: Create a short URL
      description: >-
        Send JSON. Use the returned short URL as the link href. Avoid automatically retrying
        creation requests: each request may create a new link.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLinkRequest'
            examples:
              automatic:
                summary: Generated code and default 24-hour lifetime
                value:
                  url: https://example.com/article
              custom:
                summary: Custom code with a one-hour lifetime
                value:
                  url: https://example.com/article
                  short: my-link
                  expiry: 1
      responses:
        '200':
          description: Link created. Use short for the link and expiry for its lifetime in hours.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateLinkResponse'
              example:
                url: https://example.com/article
                short: http://localhost:3000/my-link
                expiry: 1
                rate_limit: 9
                rate_limit_reset: 29
        '400':
          description: Invalid input. Display the error message next to the form.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: custom code must be 3–32 characters
        '409':
          description: Custom code is already taken. Ask the user to choose another.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: URL short already in use
        '500':
          description: Server error. Show a failure message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: cannot connect to DB
        '503':
          description: >-
            Request rejected or temporarily unavailable. For quota errors, rate_limit_reset is the
            wait in minutes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Rate limit exceeded
                rate_limit_reset: 29
  /{code}:
    get:
      tags:
        - Links
      operationId: resolveShortLink
      summary: Redirect to a short link's destination
      description: >-
        Open the short URL using an <a> link or browser navigation. Returns a 302 redirect with
        Cache-Control: no-store; missing or expired links return 404. Swagger may report a CORS
        error when following a redirect to another website.
      parameters:
        - name: code
          in: path
          required: true
          description: Short code, for example my-link or an automatically generated code.
          schema:
            type: string
            minLength: 1
          example: my-link
      responses:
        '302':
          description: Redirects to the destination in the Location header. No JSON body.
          headers:
            Location:
              description: Destination URL stored for this code.
              required: true
              schema:
                type: string
                format: uri
              example: https://example.com/article
            Cache-Control:
              description: Prevents storage of the redirect response.
              required: true
              schema:
                type: string
                enum:
                  - no-store
              example: no-store
        '404':
          description: No mapping exists for this code, or the mapping has expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: short no found
        '500':
          description: Server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: cannot connect to DB
components:
  schemas:
    CreateLinkRequest:
      type: object
      required:
        - url
      properties:
        url:
          type: string
          format: uri
          pattern: ^https?://
          description: Required. Complete URL starting with http:// or https:// and a hostname.
          example: https://example.com/article
        short:
          type: string
          maxLength: 32
          pattern: ^(?![dD][oO][cC][sS]$)([A-Za-z0-9_-]{3,32})?$
          default: ''
          description: >-
            Optional. Blank generates a code. Otherwise 3–32 letters A–Z, a–z, digits, - or _.
            Case-sensitive; docs is reserved in any letter case.
          example: my-link
        expiry:
          type: integer
          format: int64
          minimum: 0
          maximum: 720
          default: 24
          description: Optional. Lifetime in whole hours, 1–720. Omitted or 0 defaults to 24.
          example: 24
    CreateLinkResponse:
      type: object
      required:
        - url
        - short
        - expiry
        - rate_limit
        - rate_limit_reset
      properties:
        url:
          type: string
          format: uri
          description: Destination URL stored by the API.
        short:
          type: string
          description: Complete short URL. Use directly as href or copy to clipboard.
          example: http://localhost:3000/my-link
        expiry:
          type: integer
          format: int64
          minimum: 1
          maximum: 720
          description: Configured lifetime in hours from creation, not a live remaining-time value.
        rate_limit:
          type: integer
          description: Reported remaining creation quota.
        rate_limit_reset:
          type: integer
          format: int64
          description: Minutes until the creation quota resets.
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: Message to display when the request fails.
        rate_limit_reset:
          type: integer
          format: int64
          description: Remaining quota-window time in whole minutes; present on quota-exceeded errors.
